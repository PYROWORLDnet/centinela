name: Actualizar datos oficiales

# Cada día revisa si DIGEPRES, la DGII o el registro de contrataciones publicaron algo nuevo.
# Si hay datos nuevos Y pasaron todas las verificaciones, hace commit directo a main
# (solo del archivo de datos) y Vercel publica. Si algo no cuadra, no se publica nada.
on:
  schedule:
    - cron: "17 11 * * *" # 7:17 a. m. hora de RD
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar
        run: npm ci --prefix backend

      - name: Descargar, verificar y generar datos
        run: npm run actualizar:refresh --prefix backend

      - name: Publicar si cambió
        run: |
          if git diff --quiet -- backend/src/data/finanzas/datos.json; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name "centinela-bot"
          git config user.email "centinela-bot@users.noreply.github.com"
          git add backend/src/data/finanzas/datos.json
          git commit -m "Datos: actualización automática desde fuentes oficiales"
          # Por si main cambió mientras corría la tarea.
          git pull --rebase origin main
          git push origin HEAD:main
